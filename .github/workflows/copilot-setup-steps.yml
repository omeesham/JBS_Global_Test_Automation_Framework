# ##############################################################################
# FILE: .github/workflows/copilot-setup-steps.yml
# PURPOSE: GitHub Copilot agent environment setup and validation
# WHY NECESSARY: Ensures Copilot agents have working Node.js, dependencies,
#   Playwright browsers, and valid TypeScript compilation before generating code
# USED BY: GitHub Copilot Coding Agent (runs when agent is invoked)
#
# HOW IT WORKS:
# 1. Checks out repository code
# 2. Sets up Node.js LTS with dependencies (npm ci)
# 3. Installs Playwright browsers for test generation
# 4. Verifies TypeScript compiles without errors (npx tsc --noEmit)
# ##############################################################################

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Verify TypeScript compilation
      run: npx tsc --noEmit
