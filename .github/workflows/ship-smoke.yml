name: Ship Smoke
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pipeline/**'
      - 'clients/**'
      - 'scripts/ship-client.sh'
      - 'scripts/ship-client.ps1'
      - 'scripts/build-framework-vendor.ts'
      - 'scripts/build-framework-vendor-all.mjs'
      - 'scripts/verify-no-forbidden.mjs'
      - 'scripts/verify-vendor-fresh.mjs'
      - 'package.json'
      - 'tsconfig*.json'
      - 'clients/*/playwright.config*.ts'
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run vendor:build:all
      - name: Ship smoke (encore) — Linux/macOS
        if: matrix.os != 'windows-latest'
        run: npm run client:ship -- --client=encore --out=./_ship-test
      - name: Ship smoke (encore) — Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh ./scripts/ship-client.ps1 -Client encore -Out ./_ship-test
      - name: Verify shipped output (POSIX)
        if: matrix.os != 'windows-latest'
        run: |
          test -f _ship-test/package.json
          test -f _ship-test/tsconfig.json
          test -f _ship-test/playwright.config.ts
          test -d _ship-test/dist/framework
          test ! -d _ship-test/specs_planning
          test ! -f _ship-test/CLAUDE.md
          test ! -d _ship-test/.auth
          test ! -d _ship-test/pipeline
          # Defense-in-depth: re-run deny-list against shipped output
          # (ship-client.sh already does this; CI re-runs as second layer).
          node scripts/verify-no-forbidden.mjs --target=_ship-test
      - name: Verify shipped output (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "_ship-test/package.json")) { throw "missing package.json" }
          if (-not (Test-Path "_ship-test/tsconfig.json")) { throw "missing tsconfig.json" }
          if (-not (Test-Path "_ship-test/playwright.config.ts")) { throw "missing playwright.config.ts" }
          if (-not (Test-Path "_ship-test/dist/framework")) { throw "missing dist/framework" }
          if (Test-Path "_ship-test/specs_planning") { throw "leaked specs_planning" }
          if (Test-Path "_ship-test/CLAUDE.md") { throw "leaked CLAUDE.md" }
          if (Test-Path "_ship-test/.auth") { throw "leaked .auth" }
          if (Test-Path "_ship-test/pipeline") { throw "leaked pipeline" }
          # Defense-in-depth: re-run deny-list against shipped output
          & node scripts/verify-no-forbidden.mjs --target=_ship-test
          if ($LASTEXITCODE -ne 0) { throw "verify-no-forbidden failed" }
