# Manual-trigger CI for the Encore Playwright suite.
# Runs Ubuntu + Chromium, module-parallel (2 workers — encore-local-office +
# encore-locations). Trigger: workflow_dispatch (Run workflow button or
#   gh workflow run playwright-tests.yml).
# Required GitHub secrets: NAVIGATOR_USERNAME, NAVIGATOR_PASSWORD, BASE_URL.
# Auth: ONE setup project logs in and writes .auth/encore-state.json; both
# module workers consume it read-only via storageState. Uses an MFA-less
# automation user — NAVIGATOR_MFA_SECRET is intentionally absent.

name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Playwright (Ubuntu, Chromium, 2-worker module-parallel)
    runs-on: ubuntu-latest

    env:
      NAVIGATOR_USERNAME: ${{ secrets.NAVIGATOR_USERNAME }}
      NAVIGATOR_PASSWORD: ${{ secrets.NAVIGATOR_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      CI_ENV: e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (module-parallel, 2 workers)
        run: npx playwright test --config=playwright.config.ci.ts --workers=2 --project=encore-local-office --project=encore-locations

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (JSON / JUnit / traces / videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure raw results (re-generation source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/
          retention-days: 30
          if-no-files-found: warn
