# Manual-trigger CI for the Encore Playwright suite.
# Runs Ubuntu + Chromium, module-parallel (CI default 4 workers; override with
# MAX_WORKERS=N env). Worker count is honored via the inline expression in
# playwright.config.ts; module projects keep `fullyParallel: false` so
# dependencyGate ordering holds within each spec file. Trigger: workflow_dispatch
# (Run workflow button or `gh workflow run playwright-tests.yml`).
# Required GitHub secrets: NAVIGATOR_USERNAME, NAVIGATOR_PASSWORD, BASE_URL.
# Auth: ONE setup project logs in and writes .auth/encore-state.json; both
# module workers consume it read-only via storageState. Uses an automation
# user with no second-factor.

name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Playwright (Ubuntu, Chromium, module-parallel)
    runs-on: ubuntu-latest

    env:
      NAVIGATOR_USERNAME: ${{ secrets.NAVIGATOR_USERNAME }}
      NAVIGATOR_PASSWORD: ${{ secrets.NAVIGATOR_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      CI_ENV: e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # Fix #1b: CI mirror of the .githooks/pre-commit BUG-1 guard.
      # Catches spec authors who pushed via `git push --no-verify` or who never ran
      # `npm run plans:hooks:install`. Fails the run BEFORE Playwright spins up if any spec
      # destructures bare `page` alongside a `*Page` page-object fixture (either ordering).
      - name: Lint specs for BUG-1 page-fixture collision
        run: |
          if matches=$(grep -rnE "test\([^)]*async\s*\(\s*\{[^}]*(([a-z][a-zA-Z]*Page[^}]*,\s*page\b)|(\bpage\s*,[^}]*[a-z][a-zA-Z]*Page\b))" specs/ 2>/dev/null); then
            if [ -n "$matches" ]; then
              echo "::error::BUG-1 page-fixture collision detected — spec destructures bare 'page' alongside a *Page fixture:"
              echo "$matches"
              echo "Fix: drop 'page' from the destructure; use '<pageObjectFixture>.page' for direct page operations."
              exit 1
            fi
          fi

      - name: Run Playwright tests (module-parallel)
        run: npx playwright test --config=playwright.config.ts --project=encore-local-office --project=encore-locations

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Bundle debugging artifacts
        # One zip containing failure-summary.json + traces + screenshots + videos + logs.
        # Highest-density input for RCA — supplements the four human-browseable uploads below.
        if: always()
        run: npm run share-for-debugging

      - name: Upload debugging bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-for-debugging
          path: reports/share-for-debugging-*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (JSON / JUnit / traces / videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure raw results (re-generation source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/
          retention-days: 30
          if-no-files-found: warn
