trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'

pr:
  branches:
    include:
      - main
      - develop

schedules:
  - cron: "0 2 * * *"
    displayName: Nightly Test Run
    branches:
      include:
        - main

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - staging
      - production

variables:
  nodeVersion: '18.x'
  npmCache: $(Pipeline.Workspace)/.npm

stages:
  - stage: Test
    displayName: Run Playwright Tests
    jobs:
      - job: TestWindows
        displayName: 'Test on Windows'
        pool:
          vmImage: 'windows-latest'
        strategy:
          matrix:
            Chrome:
              browserName: 'chrome'
            Firefox:
              browserName: 'firefox'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: $(npmCache)
            displayName: 'Cache npm packages'
          
          - script: npm ci
            displayName: 'Install dependencies'
          
          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'
          
          - script: |
              set NODE_ENV=${{ parameters.environment }}
              npx playwright test --project=$(browserName) --reporter=list,html,json,junit,allure-playwright
            displayName: 'Run tests'
          
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results.xml'
              failTaskOnFailedTests: true
            displayName: 'Publish test results'
            condition: always()
          
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'reports'
              artifactName: 'test-reports-windows-$(browserName)'
            displayName: 'Publish reports'
            condition: always()
      
      - job: TestUbuntu
        displayName: 'Test on Ubuntu'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          matrix:
            Chrome:
              browserName: 'chrome'
            Firefox:
              browserName: 'firefox'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: $(npmCache)
            displayName: 'Cache npm packages'
          
          - script: npm ci
            displayName: 'Install dependencies'
          
          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'
          
          - script: |
              export NODE_ENV=${{ parameters.environment }}
              npx playwright test --project=$(browserName) --reporter=list,html,json,junit,allure-playwright
            displayName: 'Run tests'
          
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'reports/junit-results.xml'
              failTaskOnFailedTests: true
            displayName: 'Publish test results'
            condition: always()
          
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'reports'
              artifactName: 'test-reports-ubuntu-$(browserName)'
            displayName: 'Publish reports'
            condition: always()
